services:
  - type: web
    name: security-news-scraper-api
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "bash start.sh"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_PATH
        value: /var/data/security_news.db
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
